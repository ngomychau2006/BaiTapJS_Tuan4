<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Anh Hùng Javascript vs Rồng Già</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:18px;font-family:"Segoe UI",Arial,sans-serif;color:#eaf0ff;overflow-x:hidden;
 background:radial-gradient(ellipse at 50% 0%,#2b1a5e 0%,#120c33 45%,#070617 100%)}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto}
h1{text-align:center;margin:8px 0 18px;font:900 1.9rem "Arial Black",Impact,sans-serif;letter-spacing:1px;
 background:linear-gradient(90deg,#ffb100,#fff3a0,#ff6a3d,#fff3a0,#ffb100);background-size:300% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite;
 filter:drop-shadow(0 0 12px rgba(255,160,0,.55))}
@keyframes shine{to{background-position:300% 0}}
.arena{position:relative;display:flex;align-items:center;justify-content:space-between;padding:34px 22px 26px;
 border-radius:20px;border:2px solid transparent;overflow:hidden;
 background:linear-gradient(rgba(14,12,44,.88),rgba(10,8,32,.92)) padding-box,
 linear-gradient(135deg,#3aa0ff,#ffc933,#ff4d5e,#3aa0ff) border-box;
 box-shadow:0 0 40px rgba(255,120,60,.25),0 0 80px rgba(58,160,255,.18),inset 0 0 60px rgba(0,0,0,.6)}
.arena::before{content:"";position:absolute;left:-10%;right:-10%;bottom:0;height:45%;
 background:radial-gradient(ellipse at 50% 100%,rgba(255,90,30,.35),transparent 70%);pointer-events:none}
.fighter{position:relative;flex:0 0 36%;text-align:center;font-size:.76rem;transition:filter .1s}
.fighter.hurt{filter:brightness(2.2) saturate(1.5)}
.ring{width:118px;height:118px;margin:0 auto 10px;border-radius:50%;padding:5px;
 background:conic-gradient(from 0deg,#3aa0ff,#9be7ff,#3a5bff,#3aa0ff);animation:spin 3s linear infinite;
 box-shadow:0 0 28px #3aa0ff,0 0 60px rgba(58,160,255,.4)}
.dragon .ring{background:conic-gradient(from 0deg,#ff3b3b,#ffb100,#ff3b3b,#8b0000,#ff3b3b);
 box-shadow:0 0 28px #ff4d2e,0 0 60px rgba(255,80,30,.45)}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#0d1540;display:grid;place-items:center;
 font-size:3.6rem;animation:spin 3s linear infinite reverse}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:top}
.dragon .avatar{background:#2a0b10}
.dragon .avatar span{display:block;animation:breathe 2s ease-in-out infinite;filter:drop-shadow(0 0 10px #ff7a2e)}
@keyframes breathe{50%{transform:scale(1.15) rotate(-4deg)}}
.fighter.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-9px)}50%{transform:translateX(9px)}80%{transform:translateX(-5px)}}
.fname{font-weight:800;font-size:.95rem;color:#6fd0ff;text-shadow:0 0 10px rgba(80,180,255,.7)}
.dragon .fname{color:#ffd23f;text-shadow:0 0 10px rgba(255,170,0,.7)}
.bar{position:relative;height:16px;margin:8px auto 5px;border-radius:10px;background:#05060f;border:2px solid #cfd6f5;overflow:hidden;
 box-shadow:0 0 12px rgba(255,255,255,.15)}
.bar .lag,.bar .fill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:8px}
.bar .lag{background:#fff;transition:width .9s .35s}
.bar .fill{background:#2fd35b;transition:width .35s,background .35s;box-shadow:inset 0 5px 6px rgba(255,255,255,.35)}
.stats{color:#aab4dc;font-size:.72rem}
.mid{flex:1;text-align:center;font:900 2.4rem "Arial Black",sans-serif;color:#fff;text-shadow:0 0 14px #ff9a3d,0 0 30px #ff4d2e;
 animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18);opacity:.8}}
.proj{position:absolute;top:44%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;z-index:5;
 transition:left .42s cubic-bezier(.5,0,.8,.6)}
.proj.bolt{background:radial-gradient(#fff,#7fdcff 40%,#2a7bff);box-shadow:0 0 18px 8px #3aa0ff,-30px 0 24px 4px rgba(58,160,255,.6)}
.proj.fire{width:38px;height:38px;background:radial-gradient(#fff6c0,#ffb100 35%,#ff3b00 70%);
 box-shadow:0 0 20px 10px #ff6a00,30px 0 28px 6px rgba(255,80,0,.7)}
.pop{position:absolute;top:26%;transform:translateX(-50%);z-index:6;font:900 1.7rem "Arial Black",sans-serif;pointer-events:none;
 animation:rise 1.1s ease-out forwards;text-shadow:0 2px 0 #000,0 0 12px currentColor}
.pop.dmg{color:#ff5a5a}.pop.miss{color:#b8c2e8;font-size:1.1rem}
.pop.crit{color:#ffd23f;font-size:2.1rem;top:10%}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}15%{opacity:1;transform:translate(-50%,0) scale(1.25)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
.btns{display:flex;gap:12px;margin:18px 0}
button{flex:1;padding:14px 10px;border:0;border-radius:12px;cursor:pointer;color:#fff;font:800 .88rem "Segoe UI",Arial,sans-serif;
 background:linear-gradient(180deg,#2d9cff,#0a58d6);box-shadow:0 5px 0 #063a94,0 8px 20px rgba(10,120,255,.4);
 transition:transform .1s,box-shadow .1s,filter .2s}
button:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-2px)}
button:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #063a94}
button.red{background:linear-gradient(180deg,#ff7a3d,#d92d1a);box-shadow:0 5px 0 #8a1608,0 8px 20px rgba(255,80,30,.4)}
button.gray{background:linear-gradient(180deg,#8c92b0,#555b78);box-shadow:0 5px 0 #30344d}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid #ffc933}
.log{height:190px;overflow-y:auto;padding:10px 12px;font-size:.82rem;line-height:1.55;border-radius:14px;
 background:rgba(5,6,22,.85);border:1px solid #2f3a7a;box-shadow:inset 0 0 20px rgba(0,0,0,.6)}
.log div{animation:in .3s}@keyframes in{from{opacity:0;transform:translateX(-10px)}}
.hero-hit{color:#6fd0ff}.dragon-hit{color:#ff6b7a}.crit{color:#ffd23f;font-weight:800}.miss{color:#8f99c2}.end{color:#fff;font-weight:800}
.setup{display:grid;gap:12px;width:100%;max-width:420px;margin:0 auto}
label{font-size:.85rem;color:#c4cdf0}
input,select{width:100%;padding:11px;margin-top:4px;border-radius:10px;border:1px solid #3d4a94;background:#0d1440;color:#fff;font-size:1rem}
.hidden{display:none!important}
.flash{position:fixed;inset:0;z-index:20;pointer-events:none;background:radial-gradient(circle,rgba(255,230,120,.7),rgba(255,120,0,.3));animation:fl .5s forwards}
@keyframes fl{from{opacity:1}to{opacity:0}}
body.quake{animation:shk .4s}
#result{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(3,3,15,.75);backdrop-filter:blur(4px)}
#result div{text-align:center;padding:34px 40px;border-radius:22px;background:#12123a;border:2px solid #ffc933;
 box-shadow:0 0 60px rgba(255,200,50,.45);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
#result h2{margin:0 0 8px;font:900 2rem "Arial Black",sans-serif;color:#ffd23f}
#result p{margin:0 0 18px;max-width:340px;color:#c9d2f5}
@media(max-width:560px){.ring{width:84px;height:84px}.avatar{font-size:2.4rem}h1{font-size:1.2rem}.btns{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>
var $=function(i){return document.getElementById(i)};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var hero,dragon,over,busy,auto;

/* ===== Nền: sao + tàn lửa + pháo giấy ===== */
var cv=$("bg"),cx=cv.getContext("2d"),P=[];
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
var stars=[];for(var i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,t:Math.random()*6});
function confetti(n,warm){for(var i=0;i<n;i++)P.push({x:cv.width/2,y:cv.height/2,vx:(Math.random()-.5)*16,vy:-Math.random()*14-2,g:.25,s:Math.random()*6+3,
 c:warm?"hsl("+(Math.random()*40)+",100%,55%)":"hsl("+(Math.random()*360)+",90%,60%)",l:140+Math.random()*60})}
(function loop(t){
 cx.clearRect(0,0,cv.width,cv.height);
 stars.forEach(function(s){cx.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.t));cx.fillStyle="#fff";cx.beginPath();cx.arc(s.x*cv.width,s.y*cv.height,s.r,0,7);cx.fill()});
 if(Math.random()<.5)P.push({x:Math.random()*cv.width,y:cv.height+5,vx:(Math.random()-.5)*.8,vy:-Math.random()*1.6-.6,g:0,s:Math.random()*2.5+1,c:"hsl("+(15+Math.random()*30)+",100%,55%)",l:260});
 P=P.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l--;cx.globalAlpha=Math.max(0,Math.min(1,p.l/80));cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s);return p.l>0&&p.y<cv.height+20});
 cx.globalAlpha=1;requestAnimationFrame(loop)})(0);

/* ===== Game ===== */
function fmt(n){return Number.isInteger(n)?n:n.toFixed(1)}
function startGame(){
 var name=$("inName").value.trim()||"Anh Hùng",level=5,sp=5,lv=1,xp;
 lv++;xp=150*(lv-1)+200;sp+=xp/10;
 var str=.6*sp+.1*xp,agi=.2*sp+.2*xp,intel=.6*sp+10*lv,pc="";
 switch($("inClass").value){
  case"a":pc="Chiến Binh";str+=15;agi-=10;intel-=5;break;
  case"b":pc="Sát Thủ";str-=15;agi+=10;intel+=5;break;
  case"c":pc="Thợ Săn";str-=15;intel+=15;break}
 hero={name:name,hp:level*100,max:level*100,str:str,agi:agi,int:intel};
 dragon={hp:600,max:600,str:100,agi:15,int:80};
 over=busy=auto=false;
 $("log").innerHTML="";$("result").classList.add("hidden");
 $("setupBox").classList.add("hidden");
 ["arena","btns","log"].forEach(function(i){$(i).classList.remove("hidden")});
 $("heroName").textContent=name+" ("+pc+" - Lv."+level+")";
 $("autoBtn").textContent="⏭ TỰ ĐỘNG ĐÁNH";
 render();say("Rồng Già thức giấc. Trận chiến bắt đầu!","miss")}
function bar(side,u){var pct=Math.max(0,u.hp)/u.max*100;
 $(side+"Bar").style.width=pct+"%";$(side+"Lag").style.width=pct+"%";
 $(side+"Bar").style.background="hsl("+(pct*1.2)+",75%,48%)"}
function render(){bar("hero",hero);bar("dragon",dragon);
 $("heroStats").textContent="HP: "+fmt(Math.max(0,hero.hp))+"/"+hero.max+" | STR: "+fmt(hero.str)+" | AGI: "+fmt(hero.agi)+" | INT: "+fmt(hero.int);
 $("dragonStats").textContent="HP: "+fmt(Math.max(0,dragon.hp))+"/"+dragon.max+" | STR: "+dragon.str+" | AGI: "+dragon.agi+" | INT: "+dragon.int}
function say(m,c){var d=document.createElement("div");d.className=c;d.textContent="> "+m;$("log").appendChild(d);$("log").scrollTop=1e6}
function fly(cls,a,b){return new Promise(function(res){var p=document.createElement("div");p.className="proj "+cls;p.style.left=a+"%";$("arena").appendChild(p);
 requestAnimationFrame(function(){requestAnimationFrame(function(){p.style.left=b+"%"})});setTimeout(function(){p.remove();res()},430)})}
function pop(side,txt,cls){var e=document.createElement("span");e.className="pop "+cls;e.textContent=txt;e.style.left=(side=="hero"?20:80)+"%";$("arena").appendChild(e);setTimeout(function(){e.remove()},1100)}
function hit(side,crit){var b=$(side+"Box");b.classList.add("shake","hurt");setTimeout(function(){b.classList.remove("shake","hurt")},350);
 if(crit){var f=document.createElement("div");f.className="flash";document.body.appendChild(f);setTimeout(function(){f.remove()},500);
  document.body.classList.add("quake");setTimeout(function(){document.body.classList.remove("quake")},400)}}

async function playTurn(){
 if(over||busy)return;busy=true;
 await fly("bolt",20,78);
 if(Math.random()*100>dragon.agi){
  dragon.hp-=hero.str;hit("dragon");pop("dragon","-"+fmt(hero.str),"dmg");
  say("TRẢM LONG! Bạn gây sát thương "+fmt(hero.str)+" điểm cho Rồng!","hero-hit");
  if(Math.random()*100<hero.int){await sleep(250);dragon.hp-=hero.str*2;hit("dragon",1);pop("dragon","CHÍ MẠNG -"+fmt(hero.str*2),"crit");
   say("CHÍ MẠNG! Bạn gây thêm "+fmt(hero.str*2)+" sát thương cho Rồng!","crit")}
 }else{pop("dragon","XÍ HỤT","miss");say("XÍ HỤT! Rồng đã lượn tránh được đòn tấn công của Bạn!","miss")}
 render();await sleep(550);
 if(dragon.hp<=0){busy=false;return end(true)}
 await fly("fire",80,20);
 if(Math.random()*100>hero.agi){
  hero.hp-=dragon.str;hit("hero");pop("hero","-"+dragon.str,"dmg");
  say("HỎA CẦU! Rồng gây sát thương "+dragon.str+" điểm cho Bạn!","dragon-hit");
  if(Math.random()*100<dragon.int){await sleep(250);hero.hp-=dragon.str*2;hit("hero",1);pop("hero","CHÍ MẠNG -"+dragon.str*2,"crit");
   say("CHÍ MẠNG! Rồng gây thêm "+dragon.str*2+" sát thương cho Bạn!","crit")}
 }else{pop("hero","NÉ!","miss");say("XÍ HỤT! Bạn đã tránh được đòn tấn công từ Rồng!","miss")}
 render();busy=false;
 if(hero.hp<=0)end(false)}

function end(win){
 over=true;auto=false;render();
 $("turnBtn").disabled=$("autoBtn").disabled=true;
 say(win?"CHIẾN THẮNG!!! Chúc mừng bạn đã chiến thắng!!!":"THẤT BẠI!!! Bạn đã có tên trên menu món tối của Rồng: Hiệp sĩ nướng lá lốt!","end");
 setTimeout(function(){
  $("rTitle").textContent=win?"🏆 CHIẾN THẮNG!":"💀 THẤT BẠI!";
  $("rText").textContent=win?"Rồng Già đã gục ngã. Bạn là anh hùng Javascript!":"Bạn đã có tên trên menu món tối của Rồng: Hiệp sĩ nướng lá lốt!";
  $("result").classList.remove("hidden");confetti(win?220:90,!win)},900)}

async function runAuto(){
 if(over)return;
 if(auto){auto=false;$("autoBtn").textContent="⏭ TỰ ĐỘNG ĐÁNH";return}
 auto=true;$("autoBtn").textContent="⏸ DỪNG";$("turnBtn").disabled=true;
 while(auto&&!over){await playTurn();await sleep(300)}
 if(!over){$("turnBtn").disabled=false}}
function reset(){auto=false;$("turnBtn").disabled=$("autoBtn").disabled=false;
 $("result").classList.add("hidden");["arena","btns","log"].forEach(function(i){$(i).classList.add("hidden")});$("setupBox").classList.remove("hidden")}

$("inImg").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){$("heroImg").src=e.target.result};r.readAsDataURL(f)};
$("startBtn").onclick=startGame;$("turnBtn").onclick=playTurn;$("autoBtn").onclick=runAuto;
$("resetBtn").onclick=reset;$("rBtn").onclick=reset;
</script>
</body>
</html>
